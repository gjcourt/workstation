# ~/.tmux.conf (symlinked from workstation/tmux/tmux.conf). Read when the tmux
# server starts; `prefix r` reloads it. Carried over from the old dotfiles
# repo, with the colour options moved to the *-style syntax tmux 2.9+ requires
# (the old *-fg/-bg/-attr options are errors in current tmux).

# High res colors
set -g default-terminal "screen-256color"


# Prefix is Ctrl-a (screen-style) instead of Ctrl-b; `prefix a` sends a
# literal Ctrl-a (start of line in the shell).
unbind C-b
set -g prefix C-a
bind-key a send-prefix


# Split with | (side by side) and - (stacked), opening in the current directory.
unbind %
bind | split-window -h -c '#{pane_current_path}'

unbind '"'
bind - split-window -v -c '#{pane_current_path}'


# Reload config file
bind r source-file ~/.tmux.conf


# vi mode
setw -g mode-keys vi
set -g status-keys vi


# Start window index at 1 instead of 0 (easier to reach from num bar)
set -g base-index 1


# Terminal emulator window title
set -g set-titles on
set -g set-titles-string '#S:#I.#P #W'


# Status Bar
set -g status-interval 1

set -g status-fg white
set -g status-bg colour234
set -g pane-border-style fg=colour245
set -g pane-active-border-style fg=colour39
set -g message-style fg=colour16,bg=colour221,bold

set -g status-left-length 32
set -g status-right-length 150

set -g status-left '#[fg=colour235,bg=colour252,bold] #S #[fg=colour245,bg=colour238,bold] #(hostname) '
setw -g window-status-format '#[fg=white,bg=colour234] #I|#W#F '
setw -g window-status-current-format '#[fg=colour25,bg=colour39,noreverse,bold] #I|#W#F '
# Right side: clock, then the load averages from `uptime`.
set -g status-right '#[fg=yellow]%k:%M:%S#[fg=colour33]#(uptime | cut -d "," -f 3- | cut -d ":" -f2)'


# `prefix t` clock
setw -g clock-mode-colour green
setw -g clock-mode-style 24


# History
set -g history-limit 100000


