# ~/.tmux.conf (symlinked from workstation/tmux/tmux.conf). Read when the tmux
# server starts; `prefix r` reloads it. Carried over from the old dotfiles
# repo, with the colour options moved to the *-style syntax tmux 2.9+ requires
# (the old *-fg/-bg/-attr options are errors in current tmux).


# Terminal: tmux's own terminfo (italics, proper key handling), plus 24-bit
# colour when the outer terminal advertises xterm-256color.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'

# Tell programs (vim etc.) when their pane gains or loses focus.
set -g focus-events on


# Prefix is Ctrl-Space instead of Ctrl-b. Pressing it twice jumps to the last
# window; a literal Ctrl-Space is rarely needed.
unbind C-b
set -g prefix C-Space
bind C-Space last-window


# Split with | (side by side) and - (stacked); new panes and windows open in
# the current directory.
unbind %
bind | split-window -h -c '#{pane_current_path}'

unbind '"'
bind - split-window -v -c '#{pane_current_path}'

bind c new-window -c '#{pane_current_path}'


# Move between panes with h/j/k/l; resize with H/J/K/L (repeatable without
# re-pressing the prefix).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# Mouse: click to select panes, drag borders to resize, wheel to scroll.
set -g mouse on


# Reload config file
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"


# vi mode
setw -g mode-keys vi
set -g status-keys vi

# Copy mode: v starts a selection, C-v toggles rectangle, y copies to the
# macOS clipboard (via copy-command) and leaves copy mode.
set -s copy-command 'pbcopy'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel


# Number windows and panes from 1 (easier to reach from the number row) and
# close gaps when a window is closed.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on


# Messages stay up for 2 s (default 750 ms).
set -g display-time 2000


# Terminal emulator window title
set -g set-titles on
set -g set-titles-string '#S:#I.#P #W'


# Status Bar
set -g status-interval 5

set -g status-fg white
set -g status-bg colour234
set -g pane-border-style fg=colour245
set -g pane-active-border-style fg=colour39
set -g message-style fg=colour16,bg=colour221,bold

set -g status-left-length 32
set -g status-right-length 150

# #h is tmux's built-in short hostname.
set -g status-left '#[fg=colour235,bg=colour252,bold] #S #[fg=colour245,bg=colour238,bold] #h '
setw -g window-status-format '#[fg=white,bg=colour234] #I|#W#F '
setw -g window-status-current-format '#[fg=colour25,bg=colour39,noreverse,bold] #I|#W#F '
# Right side: clock, then the 1/5/15-minute load averages (macOS sysctl prints
# them as "{ 1.23 1.42 1.62 }").
set -g status-right '#[fg=yellow]%H:%M #[fg=colour33]#(sysctl -n vm.loadavg | tr -d "{}")'


# `prefix t` clock
setw -g clock-mode-colour green
setw -g clock-mode-style 24


# History
set -g history-limit 100000
