# ~/.tmux.conf (symlinked from workstation/tmux/tmux.conf). tmux reads it when
# the server starts; `prefix r` reloads it into a running server. Settings
# that only apply to new panes (default-terminal) need a fresh pane, or a tmux
# restart, to show up.
#
# Option scopes used below: `set -g` is a global session option, `setw -g` a
# global window option, `set -s` a server option. `set -as` appends to an
# existing server option instead of replacing it.
#
# Carried over from the old dotfiles repo, with the colour options moved to the
# *-style syntax tmux 2.9+ requires (the old *-fg/-bg/-attr options are errors
# in current tmux).


# --- Terminal ----------------------------------------------------------------

# TERM inside tmux. tmux-256color is tmux's own terminfo entry: unlike the old
# screen-256color it knows about italics, strikethrough and the extra keys
# tmux can send, so vim/less render correctly. macOS ships this entry.
set -g default-terminal "tmux-256color"

# Advertise 24-bit ("true") colour to programs inside tmux when the outer
# terminal reports TERM=xterm-256color (iTerm2, Ghostty, Terminal.app all do).
# Without this, tmux downsamples truecolour themes to the 256-colour palette.
set -as terminal-features ',xterm-256color:RGB'

# Pass focus-in/focus-out events through to programs, so vim can reload files
# changed elsewhere (autoread) when you switch back to its pane.
set -g focus-events on


# --- Prefix ------------------------------------------------------------------

# Prefix is Ctrl-Space instead of the default Ctrl-b: one chord, both hands
# free, and unlike Ctrl-a it doesn't steal the shell's start-of-line key.
# macOS binds Ctrl-Space to "Select previous input source" by default; if more
# than one input source is enabled, turn that off in System Settings ->
# Keyboard -> Keyboard Shortcuts -> Input Sources or tmux never sees the key.
unbind C-b
set -g prefix C-Space

# Pressing the prefix twice toggles to the previously active window. (The usual
# alternative, send-prefix, passes a literal Ctrl-Space to the program in the
# pane; nothing here needs one.)
bind C-Space last-window


# --- Splits and windows ------------------------------------------------------

# The key looks like the divider it draws: `|` puts panes side by side, `-`
# stacks them. (tmux's own -h/-v flags name the split direction the other way
# round, which is why the defaults % and " are unbound.) New panes start in the
# current pane's directory rather than the session's start directory.
unbind %
bind | split-window -h -c '#{pane_current_path}'

unbind '"'
bind - split-window -v -c '#{pane_current_path}'

# Same for new windows (default `prefix c` opens in the start directory).
bind c new-window -c '#{pane_current_path}'


# --- Pane navigation and resizing -------------------------------------------

# vim-style pane movement: prefix h/j/k/l = left/down/up/right.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize the current pane 5 cells at a time with prefix H/J/K/L. `-r` makes the
# key repeatable: after one prefix you can tap H H H within repeat-time (500 ms)
# without pressing the prefix again.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# --- Mouse -------------------------------------------------------------------

# Click a pane to focus it, drag a border to resize, wheel to scroll back
# through history (enters copy mode). Side effect: a plain click-drag now
# selects inside tmux; hold Option (iTerm2/Terminal.app) or Shift (Ghostty) to
# use the terminal's own selection instead.
set -g mouse on


# --- Reload ------------------------------------------------------------------

# prefix r re-reads this file and confirms in the status line.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"


# --- vi keys and copy mode ---------------------------------------------------

# vi keys in copy mode (scrollback) and at the command prompt (prefix :).
setw -g mode-keys vi
set -g status-keys vi

# Where copied text goes: copy-pipe-and-cancel with no command pipes to this.
# pbcopy puts it on the macOS clipboard, so Cmd-V works outside tmux.
set -s copy-command 'pbcopy'

# In copy mode (prefix [, or scroll with the mouse): v starts a selection like
# vim's visual mode, C-v switches to a rectangular (block) selection, and y
# copies via copy-command and leaves copy mode.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel


# --- Numbering ---------------------------------------------------------------

# Windows and panes count from 1, so the first one is on the left of the number
# row instead of the far right (0). renumber-windows closes the gap when a
# window is killed: 1 2 3, close 2 -> 1 2, not 1 3.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on


# --- Messages and titles -----------------------------------------------------

# Status-line messages (like the reload confirmation) stay up for 2 s; the
# default 750 ms is easy to miss.
set -g display-time 2000

# Set the terminal emulator's window/tab title to session:window.pane name.
set -g set-titles on
set -g set-titles-string '#S:#I.#P #W'


# --- Status bar --------------------------------------------------------------

# Redraw every 5 s. The bar only shows minutes and load averages, so a 1 s
# refresh would just re-run the sysctl below for nothing.
set -g status-interval 5

# Colours: colourNNN are xterm-256 palette indexes (234 = near-black bar,
# 39 = bright blue for the active pane border and current window).
set -g status-fg white
set -g status-bg colour234
set -g pane-border-style fg=colour245
set -g pane-active-border-style fg=colour39
set -g message-style fg=colour16,bg=colour221,bold

set -g status-left-length 32
set -g status-right-length 150

# Left: session name, then the short hostname. #h is tmux's built-in (no shell
# command, unlike the old #(hostname)).
set -g status-left '#[fg=colour235,bg=colour252,bold] #S #[fg=colour245,bg=colour238,bold] #h '

# Window list: index|name plus flags (#F: * current, - last, Z zoomed).
setw -g window-status-format '#[fg=white,bg=colour234] #I|#W#F '
setw -g window-status-current-format '#[fg=colour25,bg=colour39,noreverse,bold] #I|#W#F '

# Right: 24-hour clock (strftime, rendered by tmux itself), then the 1/5/15-
# minute load averages. macOS `sysctl -n vm.loadavg` prints "{ 1.23 1.42 1.62 }";
# tr strips the braces. This replaces cutting fields out of `uptime`, whose
# comma count changes once uptime passes a day ("up 2 days, 3:12, ...").
set -g status-right '#[fg=yellow]%H:%M #[fg=colour33]#(sysctl -n vm.loadavg | tr -d "{}")'


# --- Clock and history -------------------------------------------------------

# prefix t shows a big clock: green, 24-hour.
setw -g clock-mode-colour green
setw -g clock-mode-style 24

# Scrollback lines kept per pane (default 2000).
set -g history-limit 100000
