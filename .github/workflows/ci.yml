# Lint everything, then install into a throwaway $HOME on a real macOS runner
# and check the result (scripts/test-install.sh). The Homebrew step is skipped
# (--no-brew) to keep CI fast; the Brewfiles are syntax-checked instead.
name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install shellcheck ruff
      - name: Lint
        run: make lint
      - name: Brewfiles parse
        run: |
          for f in Brewfile Brewfile.extras; do
            brew bundle list --all --file="$f" >/dev/null && echo "ok  $f"
          done
      - name: Install into a throwaway HOME
        run: make test
      - name: install.sh --dry-run from a pipe (the quick-start path)
        run: WORKSTATION_DIR="$RUNNER_TEMP/ws" /bin/bash < install.sh --dry-run
